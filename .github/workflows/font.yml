name: font-fetch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSfL -o DMSerifDisplay-Italic.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/dmserifdisplay/DMSerifDisplay-Italic.ttf
          pip install fonttools brotli >/dev/null
          pyftsubset DMSerifDisplay-Italic.ttf --unicodes="U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20B9,U+20AC,U+2122,U+2212" --flavor=woff --layout-features='*' --output-file=dm-serif-display-italic-latin.woff
          ls -la
          git init -q out && cd out && cp ../dm-serif-display-italic-latin.woff . && git checkout -q -b fonts && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "DM Serif Display Italic (OFL)" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fonts
