name: Daily prices
on:
  schedule:
    - cron: "40 16 * * 1-5" # 22:10 IST on weekdays, after markets and most NAVs
    - cron: "10 3 * * *"    # 08:40 IST daily, picks up late NAVs
  workflow_dispatch:
    inputs:
      us_probe:
        description: "Test the US price source now (logs only, publishes nothing for US)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/parse.test.mjs scripts/markets.test.mjs
      - run: node scripts/update-prices.mjs
        env:
          US_PROBE: ${{ inputs.us_probe }}
      - name: Market wrap
        run: node scripts/update-markets.mjs
        continue-on-error: true
      - name: Publish if changed
        run: |
          git config user.name "koshmos-prices"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices
          if git diff --cached --quiet; then echo "No change"; else git commit -m "Prices $(date -u +%F)" && git push; fi
